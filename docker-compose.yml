# Full stack: PostgreSQL 16 + FastAPI + React (nginx). Usage: docker compose up --build
# Then seed demo data once: docker compose exec backend python -m seed.seed
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ebms
      POSTGRES_USER: ebms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ebms_password}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebms -d ebms"]
      interval: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://ebms:${POSTGRES_PASSWORD:-ebms_password}@db:5432/ebms
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-please-use-a-long-random-value}
      CORS_ORIGINS: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      AUTO_CREATE_TABLES: "false"
      EMAIL_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
volumes:
  pg_data:
